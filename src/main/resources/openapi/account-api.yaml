openapi: 3.0.3
info:
  title: Pivot Banking System - Account Microservice API
  description: |
    RESTful Reactive API for managing Passive Bank Products (Savings, Checking, and Fixed-Term Accounts).
    Enforces customer eligibility rules via reactive communication with ms-customer, AES-256-GCM encryption at rest,
    SHA-256 blind indexing, and logical Soft Delete / Reactivation state transitions.
  version: 1.0.0
servers:
  - url: http://localhost:8082/api/v1
    description: Local Development Server (ms-account)

tags:
  - name: Accounts
    description: Operations for managing passive bank accounts, balances, and lifecycle states
  - name: Debit Cards
    description: Operations for managing debit cards, associated accounts, cascading payments, and primary account balance queries

paths:
  /accounts:
    post:
      tags:
        - Accounts
      summary: Open a new bank account
      description: Creates a SAVINGS, CHECKING, or FIXED_TERM account after validating customer rules in ms-customer.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: Bank account opened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Business rule violation (e.g., Business customer requesting Savings account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Referenced Customer ID does not exist in ms-customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate account number hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Accounts
      summary: Retrieve all bank accounts
      operationId: getAllAccounts
      responses:
        '200':
          description: Stream of all bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'

  /accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get bank account by ID
      operationId: getAccountById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Accounts
      summary: Update an existing bank account
      operationId: updateAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: Bank account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Accounts
      summary: Soft delete (logically close) a bank account by ID
      description: |
        Transitions the bank account status to CLOSED if and only if its current balance is 0.00.
        Preserves historical records for banking audit compliance.
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Bank account logically closed (status set to CLOSED)
        '400':
          description: Account still has remaining balance > 0 or is already CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/number/{accountNumber}:
    get:
      tags:
        - Accounts
      summary: Get bank account by Account Number (via SHA-256 blind index)
      operationId: getAccountByNumber
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/customer/{customerId}:
    get:
      tags:
        - Accounts
      summary: Get all bank accounts belonging to a Customer
      operationId: getAccountsByCustomerId
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of customer bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'

  /accounts/{id}/balance:
    get:
      tags:
        - Accounts
      summary: Consult available balance of a bank account
      operationId: getAccountBalance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Available balance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          description: Bank account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Accounts
      summary: Update account balance and movement counter (Used by ms-transaction)
      operationId: updateAccountBalance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceUpdateRequest'
      responses:
        '200':
          description: Balance updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Insufficient funds, monthly movement limit reached, or invalid day for FIXED_TERM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /debit-cards:
    post:
      tags:
        - Debit Cards
      summary: Issue a new debit card linked to a primary account and optional secondary accounts
      description: |
        Validates that the customer is ACTIVE, holds no OVERDUE credit debt in ms-credit,
        and owns all referenced ACTIVE bank accounts. Returns the unmasked 16-digit card number once.
      operationId: createDebitCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCardRequest'
      responses:
        '201':
          description: Debit card issued successfully (unmasked number returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
        '400':
          description: Business rule violation (overdue debt, invalid account ownership, inactive account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer or referenced bank account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Debit Cards
      summary: Retrieve all debit cards (masked card numbers)
      operationId: getAllDebitCards
      responses:
        '200':
          description: Stream of all debit cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebitCardResponse'

  /debit-cards/{id}:
    get:
      tags:
        - Debit Cards
      summary: Get debit card by ID (masked card number, Redis Cache-Aside)
      operationId: getDebitCardById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Debit card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
        '404':
          description: Debit card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Debit Cards
      summary: Update debit card linked accounts (primary/secondary order) or status
      operationId: updateDebitCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCardUpdateRequest'
      responses:
        '200':
          description: Debit card updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
        '400':
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Debit card or referenced account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Debit Cards
      summary: Soft delete (logically close) a debit card
      operationId: deleteDebitCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Debit card logically closed (status set to CLOSED)
        '404':
          description: Debit card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /debit-cards/number/{cardNumber}:
    get:
      tags:
        - Debit Cards
      summary: Get debit card by plain card number via SHA-256 blind index
      operationId: getDebitCardByNumber
      parameters:
        - name: cardNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Debit card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardResponse'
        '404':
          description: Debit card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /debit-cards/customer/{customerId}:
    get:
      tags:
        - Debit Cards
      summary: Get all debit cards belonging to a customer
      operationId: getDebitCardsByCustomerId
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of customer debit cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebitCardResponse'

  /debit-cards/{id}/balance:
    get:
      tags:
        - Debit Cards
      summary: Consult available balance of the primary account linked to the debit card
      operationId: getDebitCardPrimaryBalance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Primary account balance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          description: Debit card or primary account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /debit-cards/{id}/pay:
    patch:
      tags:
        - Debit Cards
      summary: Process a debit card payment or withdrawal with cascading debit across linked accounts
      description: |
        Attempts to debit the primary account first. If its available balance is insufficient,
        cascades through secondary accounts in their configured priority order.
        Used by ms-transaction for DEBIT_CARD_PAYMENT and DEBIT_CARD_WITHDRAWAL operations.
      operationId: payWithDebitCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCardPaymentRequest'
      responses:
        '200':
          description: Payment debited successfully across one or more linked accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCardPaymentResponse'
        '400':
          description: Insufficient combined funds, inactive card, or invalid amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Debit card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AccountType:
      type: string
      enum:
        - SAVINGS
        - CHECKING
        - FIXED_TERM

    AccountStatus:
      type: string
      description: Lifecycle status of the bank account (CLOSED represents Soft Delete)
      enum:
        - ACTIVE
        - BLOCKED
        - CLOSED
      default: ACTIVE

    AccountRequest:
      type: object
      required:
        - customerId
        - accountType
        - currency
      properties:
        accountNumber:
          type: string
        customerId:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          enum: [ PEN, USD ]
          default: PEN
        balance:
          type: number
          format: double
          minimum: 0.00
          default: 0.00
        maintenanceFee:
          type: number
          format: double
          minimum: 0.00
        minimumDailyAverage:
          type: number
          format: double
          minimum: 0.00
          description: Required minimum daily average balance for VIP Savings accounts
        minOpeningAmount:
          type: number
          format: double
          minimum: 0.00
          description: Minimum amount required to open the account
        maxMonthlyMovements:
          type: integer
          minimum: 1
        maxFreeMonthlyTransactions:
          type: integer
          minimum: 0
          description: Maximum number of commission-free transactions per month
        transactionCommissionFee:
          type: number
          format: double
          minimum: 0.00
          description: Commission fee charged per transaction once maxFreeMonthlyTransactions is exceeded
        allowedMovementDay:
          type: integer
          minimum: 1
          maximum: 31
        holders:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AccountStatus'

    AccountResponse:
      type: object
      properties:
        id:
          type: string
        accountNumber:
          type: string
        customerId:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
        balance:
          type: number
        maintenanceFee:
          type: number
        minimumDailyAverage:
          type: number
        minOpeningAmount:
          type: number
        maxMonthlyMovements:
          type: integer
          nullable: true
        maxFreeMonthlyTransactions:
          type: integer
        transactionCommissionFee:
          type: number
        lastAppliedCommission:
          type: number
          description: Commission fee applied in the most recent balance operation (0.00 if within free limit)
        currentMonthlyMovements:
          type: integer
        allowedMovementDay:
          type: integer
          nullable: true
        holders:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BalanceResponse:
      type: object
      properties:
        accountId:
          type: string
        accountNumber:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
        availableBalance:
          type: number
        currentMonthlyMovements:
          type: integer
        maxMonthlyMovements:
          type: integer
          nullable: true
        queriedAt:
          type: string
          format: date-time

    BalanceUpdateRequest:
      type: object
      required:
        - operationType
        - amount
      properties:
        operationType:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          type: number
          minimum: 0.01
          example: 250.00

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

    DebitCardStatus:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
        - CLOSED

    DebitCardRequest:
      type: object
      required:
        - customerId
        - primaryAccountId
      properties:
        customerId:
          type: string
        primaryAccountId:
          type: string
        secondaryAccountIds:
          type: array
          description: Ordered list of secondary account IDs used as fallback during cascading debits
          items:
            type: string

    DebitCardUpdateRequest:
      type: object
      properties:
        primaryAccountId:
          type: string
        secondaryAccountIds:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/DebitCardStatus'

    DebitCardResponse:
      type: object
      properties:
        id:
          type: string
        cardNumber:
          type: string
          example: '************4821'
        customerId:
          type: string
        primaryAccountId:
          type: string
        secondaryAccountIds:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/DebitCardStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DebitCardPaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01

    DebitedAccountDetail:
      type: object
      properties:
        accountId:
          type: string
        maskedAccountNumber:
          type: string
        debitedAmount:
          type: number
          format: double
        appliedCommission:
          type: number
          format: double
        previousBalance:
          type: number
          format: double
        newBalance:
          type: number
          format: double

    DebitCardPaymentResponse:
      type: object
      properties:
        debitCardId:
          type: string
        maskedCardNumber:
          type: string
        totalAmount:
          type: number
          format: double
        totalCommission:
          type: number
          format: double
        debitedAccounts:
          type: array
          items:
            $ref: '#/components/schemas/DebitedAccountDetail'
        processedAt:
          type: string
          format: date-time